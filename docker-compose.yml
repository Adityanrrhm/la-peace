version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tagira-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-tagira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tagira_dev}
      POSTGRES_DB: ${DB_NAME:-tagira}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tagira} -d ${DB_NAME:-tagira}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tagira-api
    environment:
      APP_ENV: production
      APP_PORT: 8080
      APP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-tagira}
      DB_PASSWORD: ${DB_PASSWORD:-tagira_dev}
      DB_NAME: ${DB_NAME:-tagira}
      DB_SSL_MODE: disable
      DB_MAX_OPEN_CONNS: 10
      DB_MAX_IDLE_CONNS: 5
      DB_CONN_MAX_LIFETIME: 300
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_HOURS: 24
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
      LOG_FORMAT: json
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data: